<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>원문 보고서 — KOSPI 10,000 도달 가능성 분석</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.5.1/github-markdown-dark.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" />
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked-gfm-heading-id@4.0.0/lib/index.umd.min.js"></script>
<style>
  :root {
    --bg-0: #05060d;
    --bg-1: #0a0d18;
    --bg-2: #11152a;
    --accent-gold: #f5b400;
    --accent-amber: #ffd34d;
    --text-1: #e8ecf2;
    --text-2: #9aa3b2;
    --text-3: #5d6678;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-0);
    color: var(--text-1);
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    scroll-behavior: smooth;
  }
  body {
    background:
      radial-gradient(ellipse 1200px 800px at 10% -20%, rgba(245, 180, 0, 0.08), transparent 60%),
      radial-gradient(ellipse 1000px 700px at 95% 30%, rgba(96, 165, 250, 0.06), transparent 60%),
      var(--bg-0);
    min-height: 100vh;
  }

  /* Top bar */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    backdrop-filter: blur(12px);
    background: rgba(5, 6, 13, 0.7);
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }
  .topbar-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    color: inherit;
    text-decoration: none;
  }
  .brand-badge {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, #facc15, #d97706);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    color: #000;
    font-size: 13px;
    letter-spacing: -0.02em;
  }
  .brand-title {
    font-weight: 700;
    font-size: 17px;
    letter-spacing: -0.01em;
  }
  .actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    color: var(--text-1);
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.03);
    transition: all 0.15s ease;
    cursor: pointer;
  }
  .btn:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.2);
  }
  .btn-primary {
    background: linear-gradient(135deg, #facc15, #f59e0b);
    color: #000;
    border-color: transparent;
  }
  .btn-primary:hover {
    background: linear-gradient(135deg, #fde047, #fbbf24);
    color: #000;
  }

  /* Layout */
  .layout {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px 80px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
  }
  @media (min-width: 960px) {
    .layout {
      grid-template-columns: 220px 1fr;
    }
  }
  .toc {
    position: sticky;
    top: 80px;
    align-self: start;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
    padding: 16px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.05);
    font-size: 13px;
  }
  .toc h4 {
    margin: 0 0 10px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-3);
  }
  .toc ul { list-style: none; padding: 0; margin: 0; }
  .toc li { margin: 2px 0; }
  .toc a {
    color: var(--text-2);
    text-decoration: none;
    display: block;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.12s;
    line-height: 1.35;
  }
  .toc a:hover {
    color: var(--text-1);
    background: rgba(255, 255, 255, 0.04);
  }
  .toc a.toc-h2 { padding-left: 8px; }
  .toc a.toc-h3 { padding-left: 20px; color: var(--text-3); font-size: 12px; }

  @media (max-width: 959px) {
    .toc { display: none; }
  }

  /* Markdown body — override github-markdown-css to match our theme */
  .markdown-body {
    background: rgba(10, 13, 24, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 16px;
    padding: 48px 56px;
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    color: var(--text-1);
    font-size: 15.5px;
    line-height: 1.75;
  }
  @media (max-width: 640px) {
    .markdown-body { padding: 28px 22px; font-size: 15px; }
  }
  .markdown-body h1,
  .markdown-body h2,
  .markdown-body h3,
  .markdown-body h4 {
    border-bottom: none;
    color: var(--text-1);
    letter-spacing: -0.01em;
    scroll-margin-top: 90px;
  }
  .markdown-body h1 {
    font-size: 2.1em;
    background: linear-gradient(135deg, #facc15 0%, #fbbf24 50%, #f59e0b 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    padding-bottom: 0.2em;
  }
  .markdown-body h2 {
    font-size: 1.5em;
    margin-top: 2em;
    padding-top: 0.5em;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }
  .markdown-body h2:first-of-type { border-top: none; padding-top: 0; }
  .markdown-body h3 { font-size: 1.2em; color: #ffd34d; }
  .markdown-body h4 { font-size: 1.05em; color: var(--text-2); }
  .markdown-body a { color: #60a5fa; }
  .markdown-body strong { color: #ffd34d; }
  .markdown-body blockquote {
    border-left: 3px solid #facc15;
    background: rgba(245, 180, 0, 0.05);
    color: var(--text-2);
    padding: 12px 20px;
    border-radius: 0 8px 8px 0;
  }
  .markdown-body code:not(pre code) {
    background: rgba(255, 255, 255, 0.08);
    color: #ffd34d;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.9em;
  }
  .markdown-body pre {
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 10px;
  }
  .markdown-body table {
    display: table;
    width: 100%;
    border-collapse: collapse;
    margin: 1.2em 0;
  }
  .markdown-body table th,
  .markdown-body table td {
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.08);
    padding: 10px 14px;
  }
  .markdown-body table th {
    background: rgba(245, 180, 0, 0.08);
    color: #ffd34d;
    font-weight: 700;
  }
  .markdown-body table tr {
    background: transparent;
    border-top: none;
  }
  .markdown-body table tr:nth-child(2n) td {
    background: rgba(255, 255, 255, 0.02);
  }
  .markdown-body hr {
    border: none;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    margin: 2em 0;
  }
  .markdown-body img { max-width: 100%; border-radius: 8px; }

  /* Loading / error states */
  .state {
    padding: 80px 24px;
    text-align: center;
    color: var(--text-2);
  }
  .state .spinner {
    display: inline-block;
    width: 32px;
    height: 32px;
    border: 3px solid rgba(255, 255, 255, 0.1);
    border-top-color: #facc15;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Footer */
  .pagefooter {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px 60px;
    color: var(--text-3);
    font-size: 13px;
    text-align: center;
  }
  .pagefooter a { color: var(--text-2); text-decoration: none; }
  .pagefooter a:hover { color: var(--text-1); }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="brand">
      <div class="brand-badge">10K</div>
      <div>
        <div class="brand-title">원문 보고서</div>
        <div style="font-size:11px;color:var(--text-3);margin-top:1px;">KOSPI 10,000 도달 가능성 분석</div>
      </div>
    </a>
    <div class="actions">
      <a class="btn" href="index.html">← 대시보드</a>
      <a class="btn btn-primary" href="final_report.md" download="kospi-10k-final-report.md">⬇ MD 다운로드</a>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="toc" id="toc">
    <h4>목차</h4>
    <ul id="toc-list"><li style="color:var(--text-3);font-size:12px;">로딩 중…</li></ul>
  </aside>

  <article id="content" class="markdown-body">
    <div class="state">
      <div class="spinner"></div>
      <div>원문 보고서를 불러오는 중…</div>
    </div>
  </article>
</div>

<footer class="pagefooter">
  분석일 2026-05-27 · 5인 전문가 팀 다층 분석 · <a href="https://github.com/revfactory/kospi-10k" target="_blank" rel="noopener">GitHub</a>
</footer>

<script>
  // Configure marked with GFM + syntax highlight + heading IDs
  const { gfmHeadingId } = globalThis.markedGfmHeadingId;
  marked.use(gfmHeadingId());
  marked.setOptions({
    gfm: true,
    breaks: false,
    headerIds: true,
    mangle: false,
  });

  function slugify(text) {
    return text
      .toString()
      .trim()
      .toLowerCase()
      .replace(/[^\w가-힣\s-]/g, '')
      .replace(/\s+/g, '-')
      .replace(/-+/g, '-');
  }

  function buildToc(container) {
    const headings = container.querySelectorAll('h1, h2, h3');
    const tocList = document.getElementById('toc-list');
    tocList.innerHTML = '';
    if (!headings.length) {
      tocList.innerHTML = '<li style="color:var(--text-3);font-size:12px;">목차 없음</li>';
      return;
    }
    headings.forEach((h) => {
      if (!h.id) h.id = slugify(h.textContent);
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent;
      a.className = 'toc-' + h.tagName.toLowerCase();
      li.appendChild(a);
      tocList.appendChild(li);
    });
  }

  function highlightAll(container) {
    container.querySelectorAll('pre code').forEach((el) => {
      try { hljs.highlightElement(el); } catch (_) {}
    });
  }

  async function load() {
    const target = document.getElementById('content');
    try {
      const res = await fetch('final_report.md', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const md = await res.text();
      target.innerHTML = marked.parse(md);
      buildToc(target);
      highlightAll(target);

      // Jump to hash if present
      if (location.hash) {
        const el = document.querySelector(location.hash);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    } catch (err) {
      target.innerHTML = `
        <div class="state">
          <div style="font-size:48px;margin-bottom:8px;">⚠️</div>
          <div style="color:#ff5757;font-weight:600;margin-bottom:6px;">원문 보고서를 불러오지 못했습니다</div>
          <div style="font-size:13px;color:var(--text-3);margin-bottom:18px;">${err.message}</div>
          <a class="btn" href="final_report.md">final_report.md 직접 열기</a>
        </div>`;
    }
  }

  load();
</script>

</body>
</html>
