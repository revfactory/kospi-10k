name: KOSPI Snapshot

on:
  schedule:
    # 한국 시장 시간(09:00-15:30 KST = 00:00-06:30 UTC) 중 10분 간격
    # 종가 확정(15:40 KST = 06:40 UTC) 후 한 번 더
    - cron: '*/10 0-7 * * 1-5'
    # 주말·휴장일에도 하루 1회는 갱신 (KRX 휴장이면 마지막 거래일 유지)
    - cron: '0 1 * * 0,6'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_kospi.py'
      - '.github/workflows/kospi-data.yml'

permissions:
  contents: write

concurrency:
  group: kospi-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Fetch KOSPI snapshot
        run: python scripts/fetch_kospi.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/kospi.json; then
            echo "no change"
            exit 0
          fi
          git add data/kospi.json
          git commit -m "data: KOSPI 스냅샷 갱신 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
